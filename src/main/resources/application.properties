spring.application.name=monitoring
server.port=8081

spring.jackson.time-zone=Asia/Taipei


management.endpoints.web.exposure.include=*
management.endpoint.health.show.details=always

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true
springdoc.use-management-port=true
management.endpoints.web.exposure.include=openapi,swagger-ui,prometheus
management.server.port=9090


spring.main.allow-bean-definition-overriding=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
#spring.datasource.url=jdbc:mysql://localhost:3306/network
spring.datasource.username=root
spring.datasource.password=1qaz@WSX
spring.datasource.poolName=Hikari_NETWORK_CORE
spring.datasource.autoCommit=false
spring.datasource.maximum-pool-size=2
spring.datasource.jdbcUrl=jdbc:mysql://localhost:3306/network
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver


spring.fin.datasource.type=com.zaxxer.hikari.HikariDataSource
